<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DNS &amp; Network</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .dns { width: 540px; }
  .dns .stats { display: flex; gap: 32px; margin-top: 8px; }
  .dns .legend { display: flex; gap: 20px; margin-top: 8px; }
  .dns .legend .sub { display: flex; align-items: center; gap: 6px; font-size: 16px; }
  .dns .legend b { color: var(--ink); font-family: var(--f-num); font-size: 18px; }
  .lan { width: 424px; }
  .lan .nums { display: flex; gap: 22px; margin: 2px 0 4px; }
  .ports { flex: 1; }
  .ports .it { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; row-gap: 3px; margin-top: 8px; }
  .ports .it .nm { font-size: 16px; color: var(--ink-2); }
  .ports .it .num { font-size: 20px; text-align: right; }
  .ports .it .num .unit { font-size: .65em; }
  .ports .it .meter { grid-column: 1 / -1; height: 6px; }
</style>
</head>
<body data-screen="network" data-status="ok">
<aside class="rail">
  <div class="rail-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg>
    <h1>Network</h1>
  </div>
  <div><div class="clock" data-clock></div><div class="date" data-date></div></div>
  <div class="badge" data-badge></div>
  <div class="dots" data-dots="7" data-on="5"></div>
</aside>

<main class="stage">
  <!-- Technitium DNS (last-hour totals) -->
  <section class="tile dns">
    <div class="label"><i class="st" data-bind="dns.instances_up" data-fmt="none" data-warn="<2" data-crit="<1"></i>DNS · Technitium · last hour</div>
    <div class="stats">
      <div><div class="caption">queries</div><div class="num xl" data-bind="dns.queries" data-fmt="compact"></div></div>
      <div><div class="caption">blocked</div><div class="num xl" data-bind="dns.blocked_pct" data-fmt="pct1"></div></div>
      <div><div class="caption">clients</div><div class="num xl med" data-bind="dns.clients"></div></div>
    </div>
    <svg width="508" height="18" style="margin-top:auto" data-chart="stack"
         data-bind="dns.resolved,dns.cached,dns.blocked" data-colors="--c-1,--c-3,--c-2"></svg>
    <div class="legend">
      <div class="sub"><i class="sw c1"></i>resolved <b data-bind="dns.resolved_pct" data-fmt="pct"></b></div>
      <div class="sub"><i class="sw c3"></i>cached <b data-bind="dns.cached_pct" data-fmt="pct"></b></div>
      <div class="sub"><i class="sw c2"></i>blocked <b data-bind="dns.blocked_pct" data-fmt="pct"></b></div>
    </div>
  </section>

  <!-- TL-SG3428X aggregate -->
  <section class="tile lan">
    <div class="label">LAN switch · total · last hour</div>
    <div class="nums">
      <div class="row c"><i class="sw c1"></i><span class="num md" data-bind="lan.in_bps" data-fmt="bps"></span><span class="caption">in</span></div>
      <div class="row c"><i class="sw c2"></i><span class="num md" data-bind="lan.out_bps" data-fmt="bps"></span><span class="caption">out</span></div>
    </div>
    <svg width="392" height="112" data-chart="area" data-bind="lan.in_mbps_1h,lan.out_mbps_1h"
         data-colors="--c-1,--c-2" data-fills="1,0" data-max="3000" data-grid="1000,2000,3000" data-axis-w="0"
         data-xlabels="−60m,−45m,−30m,−15m,now"></svg>
  </section>

  <!-- ports -->
  <section class="tile ports">
    <div class="row" style="justify-content:space-between">
      <div class="label">Ports up</div>
      <div class="num md"><span data-bind="lan.ports_up"></span><span class="unit">/ <span data-bind="lan.ports_total"></span></span></div>
    </div>
    <div class="caption" style="margin-top:6px">busiest now</div>
    <div data-list="lan.top_ports" data-max-items="3">
      <template>
        <div class="it">
          <span class="nm ell" data-bind=".name"></span>
          <span class="num" data-bind=".bps" data-fmt="bps"></span>
          <div class="meter" data-bind=".util_pct"><i></i></div>
        </div>
      </template>
    </div>
  </section>
</main>
