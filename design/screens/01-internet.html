<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Internet</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .live { width: 300px; justify-content: space-between; }
  .chart { flex: 1; }
  .chart .head { display: flex; justify-content: space-between; align-items: center; height: 20px; margin-bottom: 8px; }
  .ping { width: 264px; padding-top: 12px; padding-bottom: 8px; }
  .ping .r { display: flex; align-items: center; gap: 10px; flex: 1; border-top: 2px solid var(--line); }
  .ping .r:first-of-type { border-top: 0; }
  .ping .name { font-size: 18px; font-weight: 500; }
  .ping .loss { font-size: 15px; color: var(--ink-3); margin-top: 2px; }
  .st-v { color: var(--ink-2); font-weight: 600; }
  .st-v .unit { font-size: inherit; color: inherit; margin-left: 1px; }
</style>
</head>
<body data-screen="internet" data-status="ok">
<aside class="rail">
  <div class="rail-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.5" ry="10"/><path d="M2 12h20"/></svg>
    <h1>Internet</h1>
  </div>
  <div><div class="clock" data-clock></div><div class="date" data-date></div></div>
  <div class="badge" data-badge></div>
  <div class="dots" data-dots="9" data-on="1"></div>
</aside>

<main class="stage">
  <!-- live WAN rate -->
  <section class="tile live">
    <div>
      <div class="label"><i class="sw c1"></i>Download · now</div>
      <div class="num hero" data-bind="wan.down_bps" data-fmt="bps"></div>
    </div>
    <div>
      <div class="label"><i class="sw c2"></i>Upload · now</div>
      <div class="num lg" data-bind="wan.up_bps" data-fmt="bps"></div>
    </div>
  </section>

  <!-- 6 h throughput; dashed line = last speedtest (measured capacity) -->
  <section class="tile chart">
    <div class="head">
      <div class="label">WAN · last 6 h</div>
      <div class="label muted" style="text-transform:none">SPEEDTEST <b class="st-v" data-bind="speedtest.down_bps" data-fmt="bps"></b> · <b class="st-v" data-bind="speedtest.ping_ms" data-nounit data-fmt="ms"></b> ms ±<b class="st-v" data-bind="speedtest.jitter_ms" data-nounit data-fmt="ms"></b> · <span data-bind="speedtest.age_s" data-fmt="ago"></span></div>
    </div>
    <svg width="612" height="150" data-chart="area"
         data-bind="wan.down_mbps_6h,wan.up_mbps_6h" data-colors="--c-1,--c-2" data-fills="1,0"
         data-max="auto" data-axis-w="44"
         data-xlabels="−6h,−5h,−4h,−3h,−2h,−1h,now"
         data-ref="speedtest.down_mbps" data-ref-label="speedtest {v} Mb/s"></svg>
  </section>

  <!-- ICMP probes -->
  <section class="tile ping">
    <div class="label">Ping · 5 min</div>
    <div class="col" style="flex:1" data-list="ping">
      <template>
        <div class="r">
          <i class="st" data-bind=".loss_pct" data-fmt="none" data-warn=">1" data-crit=">5"></i>
          <div class="grow">
            <div class="name" data-bind=".target"></div>
            <div class="loss"><span data-bind=".loss_pct" data-fmt="pct"></span> loss</div>
          </div>
          <div class="num md" data-bind=".rtt_ms" data-fmt="ms"></div>
        </div>
      </template>
    </div>
  </section>
</main>

<script type="application/json" id="data">

<script src="../display.js"></script>
</body>
</html>
