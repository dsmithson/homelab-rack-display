<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overview</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .stage { gap: 10px; }
  .ov { flex: 1 1 0; padding: 12px 14px 12px; }
  .ov .num { font-size: 56px; margin-top: 8px; }
  .ov .num .unit { font-size: .38em; }
  .ov .sub { font-size: 17px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .ov .foot { margin-top: auto; }
  .ov .meter { height: 12px; }
</style>
</head>
<body data-screen="overview" data-status="warn">
<aside class="rail">
  <div class="rail-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <h1>Homelab</h1>
  </div>
  <div><div class="clock" data-clock></div><div class="date" data-date></div></div>
  <div class="badge" data-badge></div>
  <div class="dots" data-dots="7" data-on="0"></div>
</aside>

<main class="stage">
  <section class="tile ov">
    <div class="label"><i class="st" data-bind="wan.loss_pct_max" data-fmt="none" data-warn=">1" data-crit=">5"></i>Internet</div>
    <div class="num" data-bind="wan.down_bps" data-fmt="bps"></div>
    <div class="sub">↑ <span data-bind="wan.up_bps" data-fmt="bps"></span> up</div>
    <svg class="foot" width="136" height="40" data-chart="spark" data-bind="wan.down_mbps_1h" data-color="--c-1" data-fill="1" data-min="0"></svg>
  </section>

  <section class="tile ov" data-bind="cluster.pod_problems" data-fmt="none" data-warn=">0">
    <div class="label"><i class="st" data-bind="cluster.nodes_notready" data-fmt="none" data-crit=">0"></i>Cluster</div>
    <div class="num"><span data-bind="cluster.nodes_ready"></span><span class="unit">/ <span data-bind="cluster.nodes_total"></span> ready</span></div>
    <div class="sub"><i class="st" style="width:12px;height:12px" data-bind="cluster.pod_problems" data-fmt="none" data-warn=">0"></i><span data-bind="cluster.pod_problems"></span> pod problems</div>
    <div class="foot"><div class="caption" style="margin-bottom:5px">avg CPU <span data-bind="cluster.cpu_avg_pct" data-fmt="pct"></span></div>
      <div class="meter" data-bind="cluster.cpu_avg_pct" data-warn=">85" data-crit=">95"><i></i></div></div>
  </section>

  <section class="tile ov">
    <div class="label"><i class="st" data-bind="jellyfin.up" data-fmt="none" data-crit="<1"></i>Media</div>
    <div class="num"><span data-bind="jellyfin.streams"></span><span class="unit">streams</span></div>
    <div class="sub"><i class="sw c4"></i><span data-bind="jellyfin.transcodes"></span> transcoding</div>
    <div class="foot" data-list="jellyfin.sessions" data-max-items="2">
      <template><div class="caption ell"><span data-bind=".user"></span> · <span data-bind=".title"></span></div></template>
    </div>
  </section>

  <section class="tile ov">
    <div class="label"><i class="st" data-bind="ups.on_battery" data-fmt="none" data-crit=">0"></i>UPS</div>
    <div class="num" data-bind="ups.battery_pct" data-fmt="pct"></div>
    <div class="sub"><span data-bind="ups.runtime_s" data-fmt="dur"></span> runtime</div>
    <div class="foot"><div class="caption" style="margin-bottom:5px">load <span data-bind="ups.load_pct" data-fmt="pct"></span></div>
      <div class="meter" data-bind="ups.load_pct" data-warn=">70" data-crit=">90"><i></i></div></div>
  </section>

  <section class="tile ov">
    <div class="label"><i class="st" data-bind="nas.volume_used_pct" data-fmt="none" data-warn=">90" data-crit=">95"></i>NAS</div>
    <div class="num"><span data-bind="nas.volume_used_pct" data-fmt="pct"></span></div>
    <div class="sub"><span data-bind="nas.volume_free_tb" data-fmt="tb"></span> free</div>
    <div class="foot"><div class="caption" style="margin-bottom:5px">volume 1 used</div>
      <div class="meter" data-bind="nas.volume_used_pct" data-warn=">90" data-crit=">95"><i></i></div></div>
  </section>

  <section class="tile ov">
    <div class="label"><i class="st" data-bind="dns.instances_up" data-fmt="none" data-warn="<2" data-crit="<1"></i>DNS</div>
    <div class="num" data-bind="dns.blocked_pct" data-fmt="pct1"></div>
    <div class="sub">blocked of <span data-bind="dns.queries" data-fmt="compact"></span></div>
    <svg class="foot" width="136" height="40" data-chart="bars" data-bind="dns.queries_24h" data-color="--c-1"></svg>
  </section>

  <section class="tile ov">
    <div class="label"><i class="st ok"></i>LAN</div>
    <div class="num" data-bind="lan.in_bps" data-fmt="bps"></div>
    <div class="sub"><span data-bind="lan.ports_up"></span> / <span data-bind="lan.ports_total"></span> ports up</div>
    <svg class="foot" width="136" height="40" data-chart="spark" data-bind="lan.in_mbps_1h" data-color="--c-1" data-fill="1" data-min="0"></svg>
  </section>
</main>

<script src="../display.js"></script>
</body>
</html>
