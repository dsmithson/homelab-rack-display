<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alerts</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .sum { width: 250px; display: flex; flex-direction: column; gap: var(--gap); flex: none; }
  .blk { border-radius: var(--radius); display: flex; align-items: center; gap: 14px; padding: 0 20px; }
  .blk .num { font-size: 88px; }
  .blk .label { color: inherit; font-size: 20px; font-weight: 700; letter-spacing: .1em; }
  .blk.crit { flex: 1.35; background: var(--crit-solid); color: #fff; }
  .blk.warn { flex: 1; background: var(--warn); color: #080C10; }
  .blk.warn .num { font-size: 60px; }
  .blk[data-status="ok"] { background: var(--surface); color: var(--ink-3); }

  .list { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .al { display: grid; grid-template-columns: 22px minmax(0, auto) 1fr auto; align-items: center; column-gap: 14px;
        background: var(--surface); border-radius: var(--radius-sm); padding: 0 18px 0 16px; flex: 1; position: relative; overflow: hidden; }
  .al::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--warn); }
  .al .st { width: 18px; height: 18px; }
  .al .nm { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .al .dt { font-size: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .al .age { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--ink-2); }
  .al[data-sev="critical"] { flex: 1.5; background: var(--crit-bg); box-shadow: inset 0 0 0 2px var(--crit); }
  .al[data-sev="critical"]::before { background: var(--crit); }
  .al[data-sev="critical"] .nm { font-size: 28px; }
  .al[data-sev="critical"] .dt { color: var(--ink); font-size: 20px; }
  .al[data-sev="critical"] .age { color: var(--ink); font-size: 26px; }
  .al[data-sev="critical"] .st { background: var(--crit); border-radius: 2px; clip-path: none; }
  .al[data-sev="warning"] .st { background: var(--warn); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
</style>
</head>
<body data-screen="alerts" data-status="crit">
<aside class="rail">
  <div class="rail-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
    <h1>Alerts</h1>
  </div>
  <div><div class="clock" data-clock></div><div class="date" data-date></div></div>
  <div class="badge" data-badge></div>
  <div class="dots" data-dots="9" data-on="6"></div>
</aside>

<main class="stage">
  <div class="sum">
    <div class="blk crit" data-bind="alerts.critical" data-fmt="none" data-crit=">0"><div class="num" data-bind="alerts.critical"></div><div class="label">Critical</div></div>
    <div class="blk warn" data-bind="alerts.warning" data-fmt="none" data-warn=">0"><div class="num" data-bind="alerts.warning"></div><div class="label">Warning</div></div>
  </div>
  <div class="list" data-list="alerts.firing" data-max-items="4">
    <template>
      <div class="al" data-attr-data-sev=".severity">
        <i class="st"></i>
        <div class="nm" data-bind=".name"></div>
        <div class="dt" data-bind=".summary"></div>
        <div class="age" data-bind=".for_s" data-fmt="age"></div>
      </div>
    </template>
  </div>
</main>

<script type="application/json" id="data">
{
  "clock": { "time": "02:17", "date": "Tue 29 Sep" },
  "alerts": {
    "critical": 1, "warning": 3, "rules_total": 39,
    "firing": [
      { "severity": "critical", "name": "APC UPS battery status abnormal", "summary": "On battery · 91% · 38 min left", "for_s": 240 },
      { "severity": "warning",  "name": "Pod in CrashLoopBackOff", "summary": "immich / immich-machine-learning", "for_s": 1500 },
      { "severity": "warning",  "name": "Synology disk temperature high", "summary": "Disk 3 · 52 °C", "for_s": 3900 },
      { "severity": "warning",  "name": "Backup CronJob stale", "summary": "immich-db-backup · 31 h", "for_s": 18000 }
    ]
  }
}
</script>
<script src="../display.js"></script>
</body>
</html>
