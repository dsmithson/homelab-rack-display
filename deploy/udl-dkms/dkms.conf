# DKMS package for the in-tree udl (DisplayLink DL-1x5 USB 2.0) DRM driver,
# built out of tree because the Ubuntu rockchip kernel ships without it
# (CONFIG_DRM_UDL is not set). Rebuilt automatically on kernel upgrades.
PACKAGE_NAME="udl"
PACKAGE_VERSION="6.1"
BUILT_MODULE_NAME[0]="udl"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
