# Values for the rack-display chart (github.com/dsmithson/homelab-rack-display/chart).
image:
  repository: dsmithson/rack-display
  tag: "latest"
  pullPolicy: Always

timezone: America/Phoenix

panel:
  enabled: true
  device: auto
  # The DisplayLink panel is USB-attached here. The node needs the out-of-tree
  # udl module loaded (see the app repo's docs/panel-driver.md).
  node: turing01-04

grafana:
  # kubectl create secret generic rack-display-grafana -n rack-display \
  #   --from-literal=GRAFANA_TOKEN=<token from grafana-terraform output>
  existingSecret: rack-display-grafana

ingress:
  host: rackdisplay.int.knightware.net
