apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rack-display
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  sources:
    - repoURL: https://github.com/dsmithson/homelab-rack-display
      targetRevision: main
      path: chart
      helm:
        valueFiles:
          - $values/rack-display/values.yaml
    - repoURL: https://github.com/dsmithson/homelab-helm-charts
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: rack-display

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
